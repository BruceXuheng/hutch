# 单 workflow：扫描 tools/*.md 生成 index.json → vite build → 部署 Pages
# tools 或源码任一变更都触发；不把 index.json commit 回仓库（在 CI 内生成进 dist）
name: build-and-deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/build-index.mjs
      - run: npm run build
      - run: cp dist/index.html dist/404.html   # SPA history fallback：直接访问 /tool/<id> 不 404
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
